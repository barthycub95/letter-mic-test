<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Тест записи письма</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263448;
      background: linear-gradient(145deg, #eaf6ff, #fff8ea);
    }

    main {
      width: min(100%, 460px);
      padding: 26px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(39, 73, 110, 0.12);
    }

    .label {
      color: #3978ac;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 12px 0;
      font-size: 27px;
      line-height: 1.15;
    }

    p {
      line-height: 1.5;
    }

    .privacy {
      padding: 12px;
      border-radius: 12px;
      background: #f1f8fc;
      font-size: 14px;
    }

    #status {
      min-height: 52px;
      margin: 18px 0;
      padding: 12px;
      border-radius: 12px;
      background: #fff8e8;
      line-height: 1.4;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: 0;
      border-radius: 14px;
      background: #3978ac;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #c8d2dc;
      cursor: default;
    }

    audio {
      width: 100%;
      margin-top: 16px;
    }

    .footnote {
      color: #697787;
      font-size: 13px;
    }

    @media (max-width: 360px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="label">ТЕСТ МИКРОФОНА</div>
    <h1>Письмо Деду Морозу</h1>

    <p>Запишите короткую тестовую фразу, а затем прослушайте её.</p>

    <p class="privacy">
      Запись не отправляется и не сохраняется на сервере. Она доступна только
      пока открыта эта страница.
    </p>

    <div id="status" role="status" aria-live="polite">
      Нажмите «Записать» и разрешите доступ к микрофону.
    </div>

    <div class="buttons">
      <button id="start">🎙 Записать</button>
      <button id="stop" disabled>⏹ Остановить</button>
    </div>

    <div class="buttons">
      <button id="play" disabled>▶ Прослушать</button>
      <button id="again" disabled>↻ Записать заново</button>
    </div>

    <audio id="player" controls hidden></audio>

    <p class="footnote">Длина тестовой записи — не более 20 секунд.</p>
  </main>

  <script>
    const telegramApp = window.Telegram && window.Telegram.WebApp;
    if (telegramApp) {
      telegramApp.ready();
      telegramApp.expand();
    }

    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const playButton = document.getElementById("play");
    const againButton = document.getElementById("again");
    const statusBox = document.getElementById("status");
    const player = document.getElementById("player");

    let mediaRecorder = null;
    let audioStream = null;
    let audioChunks = [];
    let audioUrl = null;
    let stopTimer = null;

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function stopMicrophone() {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
    }

    function clearPlayback() {
      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
        audioUrl = null;
      }

      player.pause();
      player.removeAttribute("src");
      player.load();
      player.hidden = true;
      playButton.disabled = true;
      againButton.disabled = true;
    }

    function stopRecording() {
      if (stopTimer) {
        clearTimeout(stopTimer);
        stopTimer = null;
      }

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      } else {
        stopMicrophone();
      }
    }

    startButton.addEventListener("click", async () => {
      clearPlayback();
      audioChunks = [];

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showStatus("Не удалось открыть микрофон. Откройте страницу по HTTPS в современном браузере.");
        return;
      }

      if (typeof MediaRecorder === "undefined") {
        showStatus("Этот браузер не поддерживает запись. Попробуйте открыть страницу в другом браузере.");
        return;
      }

      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        const formats = [
          "audio/mp4",
          "audio/mp4;codecs=mp4a.40.2",
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus"
        ];

        const supportedFormat = formats.find(format =>
          MediaRecorder.isTypeSupported &&
          MediaRecorder.isTypeSupported(format)
        );

        mediaRecorder = supportedFormat
          ? new MediaRecorder(audioStream, { mimeType: supportedFormat })
          : new MediaRecorder(audioStream);

        mediaRecorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const format =
            mediaRecorder.mimeType ||
            (audioChunks[0] && audioChunks[0].type) ||
            "";

          const recording = format
            ? new Blob(audioChunks, { type: format })
            : new Blob(audioChunks);

          stopMicrophone();

          startButton.disabled = false;
          stopButton.disabled = true;

          if (recording.size === 0) {
            showStatus("Запись не получилась. Попробуйте ещё раз.");
            return;
          }

          audioUrl = URL.createObjectURL(recording);
          player.src = audioUrl;
          player.hidden = false;
          playButton.disabled = false;
          againButton.disabled = false;

          showStatus("Запись готова. Нажмите «Прослушать» или запишите заново.");
        };

        mediaRecorder.start();

        startButton.disabled = true;
        stopButton.disabled = false;
        playButton.disabled = true;
        againButton.disabled = true;

        showStatus("Идёт запись. Максимальная длительность — 20 секунд.");

        stopTimer = setTimeout(stopRecording, 20000);
      } catch (error) {
        stopMicrophone();
        startButton.disabled = false;
        stopButton.disabled = true;

        if (error.name === "NotAllowedError" || error.name === "SecurityError") {
          showStatus("Нет доступа к микрофону. Разрешите его для браузера или Telegram в настройках телефона.");
        } else if (error.name === "NotFoundError") {
          showStatus("Не удалось найти микрофон на устройстве.");
        } else {
          showStatus("Не удалось начать запись. Обновите страницу и попробуйте ещё раз.");
        }
      }
    });

    stopButton.addEventListener("click", stopRecording);

    playButton.addEventListener("click", () => {
      player.play().catch(() => {
        showStatus("Не получилось воспроизвести запись. Попробуйте записать её ещё раз.");
      });
    });

    againButton.addEventListener("click", () => {
      clearPlayback();
      audioChunks = [];
      startButton.disabled = false;
      showStatus("Можно записать новую тестовую фразу.");
    });
  </script>
</body>
</html>
